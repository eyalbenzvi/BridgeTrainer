name: Forge bidding problems

# Generates BIDDING problems on a GitHub-hosted runner, classifies them into
# the 10-category taxonomy with the GitHub Models free inference tier, and
# pushes them to Firestore — no local machine, no Claude Code session, and no
# paid LLM tokens.
#
# This is the sibling of forge-leads-mp.yml / forge-leads-imp.yml. The extra
# step is classification: bidding categories are an LLM judgment (leads are a
# mechanical fact of the contract). scripts/classify_pool.py does it via GitHub
# Models, authenticated with GITHUB_TOKEN — which is why this job grants
# `permissions: models: read`.
#
# Two ways to run:
#   * AS A CYCLE STAGE — forge-cycle.yml calls this workflow as the first of its
#     three back-to-back stages, passing no count, which selects the batch size
#     below (FORGE_BIDDING_COUNT problems, default 10). That is the production
#     path; this file has no schedule of its own. Tune via repository variables
#     (Settings → Secrets and variables → Actions → Variables):
#     FORGE_BIDDING_COUNT and FORGE_BIDDING_MAX_SECONDS (generation time budget,
#     default 1800 — ~1.5x the observed ~11 min run, so it truncates a
#     pathological batch instead of stalling the cycle). At 10 problems per
#     cycle and ~15.5 cycles a day that is ~31 GitHub Models requests a day
#     (5 problems per request), well inside the free tier's ~150 requests/day
#     for a low-tier model.
#   * MANUAL — Actions tab → "Run workflow": pick count, seed, time budget. Use
#     this for a one-off batch outside the cycle.
#
# What a run needs (all available on ubuntu-latest):
#   * the Ben engine — cloned + built by scripts/setup_ben.sh (pinned commit,
#     Python 3.12 venv with TensorFlow); cached between runs.
#   * outbound HTTPS to BBO (gibrest.bridgebase.com) for bid explanations, and
#     to models.github.ai for classification.
#   * `permissions: models: read` — puts the GitHub Models scope on the
#     job's GITHUB_TOKEN. If your org hasn't enabled GitHub Models for the
#     Actions token, instead create a PAT with `models:read` and store it as
#     the GITHUB_MODELS_TOKEN repository secret (read in preference below).
#   * the FIREBASE_SERVICE_ACCOUNT repository secret — the Firebase
#     service-account key JSON *content*. The push step fails clearly if it
#     is missing.

on:
  # called by forge-cycle.yml, which owns the schedule. A blank count means
  # "the cycle batch size"; a blank seed means the script's per-run time-based
  # default, so every stage run scans fresh boards.
  workflow_call:
    inputs:
      count:
        description: "Problems to generate (blank = the cycle batch size)"
        type: string
        default: ""
        required: false
      seed:
        description: "RNG seed (blank = unique per run)"
        type: string
        default: ""
        required: false
      max_seconds:
        description: "Generation time budget in seconds (blank = the stage budget)"
        type: string
        default: ""
        required: false
  workflow_dispatch:
    inputs:
      count:
        description: "Number of problems to generate"
        type: string
        default: "10"
        required: true
      seed:
        description: "RNG seed (blank = unique per run, so re-runs add new boards)"
        type: string
        default: ""
        required: false
      max_seconds:
        description: "Generation time budget in seconds"
        type: string
        default: "6000"
        required: false

# Serialize runs, so a manual batch and the cycle's stage never forge bidding at
# the same time. Queued, never cancelled; GitHub keeps at most one pending run
# per group, so firings can't pile into a backlog.
concurrency:
  group: forge-bidding
  cancel-in-progress: false

permissions:
  contents: read
  models: read      # lets the job's GITHUB_TOKEN call the GitHub Models API
  issues: write     # DB-O-7: open/append a failure-notification issue

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # only a caller-supplied count needs checking; a blank one means "use the
      # cycle batch size" and never reaches the script
      - name: Validate inputs
        if: inputs.count != ''
        env:
          COUNT: ${{ inputs.count }}
        run: |
          case "$COUNT" in
            ''|*[!0-9]*) echo "count must be a positive integer"; exit 1 ;;
          esac
          [ "$COUNT" -ge 1 ]

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Ben engine (~GBs of models + a TensorFlow venv) is expensive to
      # build; cache it keyed on the setup script (which pins the Ben commit).
      - name: Cache Ben engine and venvs
        uses: actions/cache@v4
        with:
          path: |
            ~/ben
            ~/benv
            ~/fbenv
          key: ben-${{ runner.os }}-${{ hashFiles('scripts/setup_ben.sh') }}

      - name: Forge, classify, and push
        # explicit bash => pipefail, so a forge failure isn't masked by tee
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Classification token: a PAT secret (models:read) if you set one,
          # otherwise the job's GITHUB_TOKEN carrying the models:read scope
          # granted by `permissions: models: read` above. run_github_models
          # prefers GITHUB_MODELS_TOKEN and an unset secret expands to "",
          # which it treats as absent.
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ inputs.count }}
          SEED: ${{ inputs.seed }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          FORGE_COUNT: ${{ vars.FORGE_BIDDING_COUNT }}
          FORGE_MAX_SECONDS: ${{ vars.FORGE_BIDDING_MAX_SECONDS }}
          PYTHON: python3.12
          # stream forge output line-by-line into the live Actions log
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$COUNT" ]; then
            # cycle stage: batch size and budget from the repo variables.
            # Time-based seed default => fresh boards.
            N="${FORGE_COUNT:-10}"
            BUDGET="${FORGE_MAX_SECONDS:-1800}"
            echo ">> cycle bidding batch: $N problems, ${BUDGET}s"
            MAX_SECONDS="$BUDGET" \
              scripts/generate_and_push_bidding.sh "$N" 2>&1 | tee forge.log
          else
            # manual dispatch: empty optional inputs fall back to the
            # script's own defaults
            [ -z "$SEED" ] && unset SEED
            [ -z "$MAX_SECONDS" ] && unset MAX_SECONDS
            scripts/generate_and_push_bidding.sh "$COUNT" 2>&1 | tee forge.log
          fi

      - name: Job summary
        if: always()
        env:
          COUNT: ${{ inputs.count }}
          FORGE_COUNT: ${{ vars.FORGE_BIDDING_COUNT }}
        run: |
          if [ -z "$COUNT" ]; then
            HEAD="cycle stage, ${FORGE_COUNT:-10} problems"
          else
            HEAD="requested $COUNT"
          fi
          {
            echo "## Bidding forge — $HEAD"
            echo
            echo '```'
            # "<id>: level N type <cat>" is printed per classified problem, so
            # this lists every id created this run and the category it got.
            grep -E "^>> |^Done:|progress: |type-classified|uploaded |: level [0-9]+ type " \
              forge.log | tail -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The generated JSON documents, for traceability/debugging (they are
      # also in Firestore by now; the pool push skips docs already present).
      - name: Upload forged problems
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forged-bidding-${{ github.run_number }}
          path: |
            data/
            forge.log
          if-no-files-found: warn
          retention-days: 30

      # DB-O-7: a failed run must not stay buried in the Actions log — the pool
      # can stop growing for days unnoticed. On failure, append to (or open) the
      # same single tracking issue the lead forges use, so the maintainer is
      # notified. Body carries no secrets — just the run link.
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "⚠️ Forge workflow is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Forge run failed (bidding): $RUN_URL (event: $GITHUB_EVENT_NAME)."
          n=$(gh issue list --state open --search "$TITLE in:title" \
                --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
