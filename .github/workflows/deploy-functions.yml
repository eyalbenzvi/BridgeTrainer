name: Deploy analysis engine

# Builds and deploys the Ben-powered analysis service to Cloud Run
# (Dockerfile -> bridge-analysis in me-west1, collocated with Firestore),
# wires the Eventarc trigger that fires it on every new analysis_requests
# document, and removes the old lightweight Cloud Function it replaces.
# Manual dispatch only — deploying compute is an owner decision.
#
# Prerequisites (already granted): Blaze plan; the FIREBASE_SERVICE_ACCOUNT
# has Editor + the Eventarc/Run service-agent bindings from the first
# function deploy. Rerun this workflow after every engine change on main —
# the image bakes the repo code at build time.

on:
  workflow_dispatch:

concurrency:
  group: deploy-analysis
  cancel-in-progress: false

env:
  PROJECT: bridgetrainer-3c759
  REGION: me-west1
  SERVICE: bridge-analysis
  TRIGGER: analysis-request-created
  RUNTIME_SA: 555589350422-compute@developer.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate gcloud
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa-key.json"
          gcloud auth activate-service-account \
            --key-file="$RUNNER_TEMP/sa-key.json"
          gcloud config set project "$PROJECT"

      - name: Build and deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --memory 2Gi --cpu 1 --timeout 900 \
            --concurrency 1 --max-instances 2 --min-instances 0 \
            --no-allow-unauthenticated \
            --service-account "$RUNTIME_SA" \
            --quiet

      - name: Ensure the Eventarc trigger exists
        run: |
          if gcloud eventarc triggers describe "$TRIGGER" \
               --location "$REGION" >/dev/null 2>&1; then
            echo "trigger already exists"
          else
            gcloud eventarc triggers create "$TRIGGER" \
              --location "$REGION" \
              --destination-run-service "$SERVICE" \
              --destination-run-region "$REGION" \
              --event-filters "type=google.cloud.firestore.document.v1.created" \
              --event-filters "database=(default)" \
              --event-filters-path-pattern "document=analysis_requests/{id}" \
              --event-data-content-type "application/protobuf" \
              --service-account "$RUNTIME_SA"
          fi

      - name: Remove the superseded Cloud Function
        run: |
          gcloud functions delete analyze_request \
            --region "$REGION" --gen2 --quiet || \
            echo "old function already gone"

      - name: Drop the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa-key.json"
